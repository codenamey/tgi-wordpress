name: Approved GHCR release
on:
  workflow_dispatch:
    inputs:
      registry_owner:
        description: Confirmed GHCR owner (lowercase)
        type: string
        required: true
      repository_visibility:
        description: Confirm existing GitHub repository visibility
        type: choice
        options: [private, public, internal]
        required: true
      approve_publish:
        description: Authorize publishing candidates and passing releases to GHCR
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ghcr-release
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.approve_publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml
  matrix:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "matrix=$(python3 scripts/builder.py matrix)" >> "$GITHUB_OUTPUT"
  publish:
    needs: [validate, matrix]
    environment: ghcr-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      TGI_OWNER: ${{ inputs.registry_owner }}
      EXPECTED_VISIBILITY: ${{ inputs.repository_visibility }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm destination and repository visibility
        run: |
          test "$TGI_OWNER" = "${GITHUB_REPOSITORY_OWNER,,}"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = "$EXPECTED_VISIBILITY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1
      - name: Build candidate, validate exact digest, promote passing images
        env:
          TGI_REGISTRY_DESTINATION: ghcr.io/${{ inputs.registry_owner }}/tgi-wordpress
          TGI_PUBLISH_APPROVAL: ghcr.io/${{ inputs.registry_owner }}/tgi-wordpress
        run: ./scripts/publish.sh '${{ matrix.php }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-php${{ matrix.php }}
          path: artifacts/*.json
