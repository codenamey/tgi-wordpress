name: Approved GHCR release
on:
  push:
    branches: [master]
    paths: ['versions/lock.json', 'versions/versions.yaml']
  workflow_dispatch:
    inputs:
      registry_owner:
        description: Confirmed GHCR owner (lowercase)
        type: string
        required: true
      repository_visibility:
        description: Confirm existing GitHub repository visibility
        type: choice
        options: [private, public, internal]
        required: true
      approve_publish:
        description: Authorize publishing candidates and passing releases to GHCR
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ghcr-release
  cancel-in-progress: false
jobs:
  authorize:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_dispatch' && inputs.approve_publish) ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[tgi-auto-php-patch] ')))
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.authorize.outputs.owner }}
      visibility: ${{ steps.authorize.outputs.visibility }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: authorize
        name: Enforce bounded automatic update or explicit manual authorization
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          INPUT_OWNER: ${{ inputs.registry_owner }}
          INPUT_VISIBILITY: ${{ inputs.repository_visibility }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [ "$EVENT_NAME" = push ]; then
            python3 scripts/prepare_update.py verify --base "$BASE_SHA"
          else
            test "$INPUT_OWNER" = "$owner"
            test "$INPUT_VISIBILITY" = "$visibility"
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"
  validate:
    needs: authorize
    uses: ./.github/workflows/ci.yml
  matrix:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      native: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          echo "matrix=$(python3 scripts/builder.py matrix)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg=json.load(open('versions/versions.yaml'))
          runners={'linux/amd64':'ubuntu-24.04','linux/arm64':'ubuntu-24.04-arm'}
          print('native='+json.dumps({'include':[{'php':b,'runner':runners[p],'platform':p,'arch':p.split('/')[1]} for b,e in cfg['php'].items() if e['enabled'] for p in e['platforms']]}))
          PY
  candidate:
    needs: [authorize, validate, matrix]
    environment: ghcr-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      TGI_OWNER: ${{ needs.authorize.outputs.owner }}
      EXPECTED_VISIBILITY: ${{ needs.authorize.outputs.visibility }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm destination and repository visibility
        run: |
          test "$TGI_OWNER" = "${GITHUB_REPOSITORY_OWNER,,}"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = "$EXPECTED_VISIBILITY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1
      - name: Build and validate native candidate digest
        env:
          TGI_REGISTRY_DESTINATION: ghcr.io/${{ needs.authorize.outputs.owner }}/tgi-wordpress
          TGI_PUBLISH_APPROVAL: ghcr.io/${{ needs.authorize.outputs.owner }}/tgi-wordpress
          TGI_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/builder.py publish-platform '${{ matrix.php }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-php${{ matrix.php }}-${{ matrix.arch }}
          path: |
            artifacts/candidate-*-${{ matrix.arch }}.json
            artifacts/verified-*-${{ matrix.arch }}.json
            artifacts/integration-*-${{ matrix.arch }}.json
            artifacts/security-*-${{ matrix.arch }}.json
            artifacts/trivy-*-${{ matrix.arch }}.json
            artifacts/sbom-*-${{ matrix.arch }}.json
  promote:
    needs: [authorize, candidate, matrix]
    environment: ghcr-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-php${{ matrix.php }}-*
          path: artifacts
          merge-multiple: true
      - name: Recheck evidence and promote complete multi-platform release
        env:
          TGI_REGISTRY_DESTINATION: ghcr.io/${{ needs.authorize.outputs.owner }}/tgi-wordpress
          TGI_PUBLISH_APPROVAL: ghcr.io/${{ needs.authorize.outputs.owner }}/tgi-wordpress
        run: python3 scripts/builder.py promote '${{ matrix.php }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-php${{ matrix.php }}
          path: artifacts/*.json
