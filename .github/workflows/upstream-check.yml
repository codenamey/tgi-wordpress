name: Observe upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe official PHP, WordPress and Debian
        run: |
          ./scripts/check-updates.sh
      - name: Retain observation report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-observation
          path: artifacts/upstream-observation.json
      - name: Write upstream summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report=json.load(open('artifacts/upstream-observation.json'))
          print('## Upstream observation')
          print('PHP source versions:', json.dumps(report['php_source_versions']))
          print('\nWordPress latest:', report['wordpress_latest'])
          print('\nSource/base lock changed:', report['php_changed'])
          print('\nFull observations are retained as an artifact. The server watcher handles guarded PHP patch releases; other changes require review.')
          PY
