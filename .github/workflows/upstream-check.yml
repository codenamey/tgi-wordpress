name: Observe upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Observe official PHP, WordPress and Debian
        run: |
          ./scripts/check-updates.sh
          mkdir -p versions
          cp artifacts/upstream-observation.json versions/upstream-observation.json
      - name: Open or update one review PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-observation
          title: 'Review upstream PHP, WordPress and Debian changes'
          commit-message: 'Record upstream version and digest changes for review'
          add-paths: versions/upstream-observation.json
          body: |
            Review the observed source versions, PHP/Debian digests and upstream commits.
            This observation does not update the accepted lock or deploy anything.
            Run resolve.sh, review packaging changes, and require all CI checks before release.
